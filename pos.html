// ─── STORAGE HELPERS (localStorage) ──────────────────────────────────────────

function storageGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ─── CALC HELPERS ─────────────────────────────────────────────────────────────

const fmtTHB = (n) => `${(Math.round(n) || 0).toLocaleString()} ฿`;
const fmtDate = (iso) => new Date(iso).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" });
const calcNetRevenue = (price, settings) =>
  Math.round(price * (1 - (settings.storeGP + settings.mktgComm) / 100));
const calcGrossProfit = (price, settings) =>
  calcNetRevenue(price, settings) - settings.costTHB;

// ─── SUB-COMPONENTS ───────────────────────────────────────────────────────────

function ProductImg({ src, style }) {
  const [err, setErr] = useState(false);
  if (err || !src) return (
    <div style={{ ...style, background: "#F0F0F0", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <span style={{ fontSize: 24, opacity: 0.3 }}>👙</span>
    </div>
  );
  return <img src={src} style={{ ...style, objectFit: "cover", display: "block" }} onError={() => setErr(true)} alt="" />;
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div style={css.toast}>{msg}</div>;
}

function CampaignBanner({ campaign, price, basePrice }) {
  const style = {
    display: "flex", alignItems: "center", gap: 8, padding: "9px 12px",
    borderRadius: 8, marginBottom: 12, fontSize: 12, fontWeight: 500,
    ...(campaign
      ? { background: "#FFF8E1", border: "1px solid #FFD54F", color: "#E65100" }
      : { background: "#F5F5F5", border: "1px solid #E0E0E0", color: "#888" }),
  };
  return (
    <div style={style}>
      <span>{campaign ? "🏷️" : "ℹ️"}</span>
      {campaign
        ? <span><strong>{campaign.name}</strong> — ราคาขาย {fmtTHB(price)} (ลด {campaign.discount}%)</span>
        : <span>ราคาปกติ {fmtTHB(price)} — ไม่มีแคมเปญที่เปิดอยู่</span>
      }
    </div>
  );
}

// ─── PAGE: POS ────────────────────────────────────────────────────────────────

function PagePOS({ stock, cart, setCart, transactions, setTransactions, setStock, settings, campaigns, saveStock, saveTxns, showToast }) {
  const activeCampaign = campaigns.find(c => c.active) || null;
  const price = activeCampaign
    ? Math.round(settings.basePrice * (1 - activeCampaign.discount / 100))
    : settings.basePrice;

  const cartCount = cart.reduce((a, i) => a + i.qty, 0);
  const cartTotal = cart.reduce((a, i) => a + i.price * i.qty, 0);

  function addToCart(code, size) {
    const qty = stock[`${code}_${size}`] || 0;
    if (!qty) { showToast("Out of stock"); return; }
    const ex = cart.find(i => i.code === code && i.size === size);
    if (ex) {
      if (ex.qty >= qty) { showToast("สต๊อกไม่พอ"); return; }
      setCart(cart.map(i => i.code === code && i.size === size ? { ...i, qty: i.qty + 1 } : i));
    } else {
      const p = PRODUCTS.find(p => p.code === code);
      setCart([...cart, { code, size, qty: 1, name: p.name, full: p.full, img: p.img, price }]);
    }
  }

  function removeFromCart(idx) { setCart(cart.filter((_, i) => i !== idx)); }

  function checkout() {
    if (!cart.length) { showToast("ตะกร้าว่าง"); return; }
    const cnt = cartCount;
    const txn = {
      id: "T" + Date.now(),
      ts: new Date().toISOString(),
      items: [...cart],
      total: cartTotal,
      sellPrice: price,
      netRevenue: calcNetRevenue(price, settings) * cnt,
      grossProfit: calcGrossProfit(price, settings) * cnt,
      campaign: activeCampaign?.name || null,
      discount: activeCampaign?.discount || 0,
    };
    const newStock = { ...stock };
    cart.forEach(item => {
      const k = `${item.code}_${item.size}`;
      newStock[k] = Math.max(0, (newStock[k] || 0) - item.qty);
    });
    setStock(newStock);
    setTransactions([txn, ...transactions]);
    setCart([]);
    saveStock(newStock);
    saveTxns([txn, ...transactions]);
    showToast(`บันทึกการขาย ${cart.length} รายการ ✓`);
  }

  return (
    <div style={css.page}>
      <CampaignBanner campaign={activeCampaign} price={price} basePrice={settings.basePrice} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 220px", gap: 12, height: 560 }}>
        {/* Product Grid */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 8, alignContent: "start", overflowY: "auto", paddingRight: 2 }}>
          {PRODUCTS.map(p => {
            const total = SIZES.reduce((a, s) => a + (stock[`${p.code}_${s}`] || 0), 0);
            return (
              <div key={p.code} style={{ ...css.card, padding: 0, overflow: "hidden" }}>
                <div style={{ position: "relative" }}>
                  <ProductImg src={p.img} style={{ width: "100%", height: 100 }} />
                  <span style={{ ...css.badge(total === 0 ? "red" : total <= 3 ? "amber" : "green"), position: "absolute", top: 6, right: 6 }}>
                    {total}
                  </span>
                </div>
                <div style={{ padding: 10 }}>
                  <div style={{ fontSize: 9, color: "#AAA", fontFamily: "monospace", marginBottom: 2 }}>{p.code}</div>
                  <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6, lineHeight: 1.3, height: 30, overflow: "hidden" }}>{p.full}</div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 7 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: "#1A1A2E" }}>{fmtTHB(price)}</span>
                    {activeCampaign && <span style={{ fontSize: 10, color: "#BBB", textDecoration: "line-through" }}>{fmtTHB(settings.basePrice)}</span>}
                  </div>
                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                    {SIZES.map(s => {
                      const q = stock[`${p.code}_${s}`] || 0;
                      return (
                        <button key={s} onClick={() => addToCart(p.code, s)} disabled={!q}
                          style={{ padding: "3px 7px", borderRadius: 6, fontSize: 11, fontWeight: 600,
                            border: `1px solid ${q ? "#1A1A2E" : "#DDD"}`,
                            background: q ? "#1A1A2E" : "#F5F5F5",
                            color: q ? "#E8C84A" : "#CCC",
                            cursor: q ? "pointer" : "not-allowed",
                          }}>
                          {s} {q > 0 && <span style={{ fontSize: 9, opacity: 0.7 }}>{q}</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Cart Panel */}
        <div style={{ ...css.card, display: "flex", flexDirection: "column", padding: 0, overflow: "hidden" }}>
          <div style={{ padding: "12px 14px", borderBottom: "1px solid #EEE", fontWeight: 700, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}>
            🛒 ตะกร้า
            {cartCount > 0 && <span style={css.badge("blue")}>{cartCount}</span>}
          </div>

          <div style={{ flex: 1, overflow: "auto", padding: "6px 10px" }}>
            {cart.length === 0
              ? <div style={{ color: "#BBB", fontSize: 12, textAlign: "center", padding: 20, fontStyle: "italic" }}>
                  ยังไม่มีสินค้า<br /><span style={{ fontSize: 10 }}>คลิกไซส์เพื่อเพิ่ม</span>
                </div>
              : cart.map((item, i) => (
                  <div key={i} style={{ display: "flex", gap: 8, padding: "8px 0", borderBottom: "1px solid #F5F5F5", alignItems: "center" }}>
                    <div style={{ width: 38, height: 38, borderRadius: 6, overflow: "hidden", flexShrink: 0 }}>
                      <ProductImg src={item.img} style={{ width: 38, height: 38 }} />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 11, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {item.name} <span style={css.badge("blue")}>{item.size}</span>
                      </div>
                      <div style={{ fontSize: 11, color: "#888" }}>×{item.qty} = {fmtTHB(item.price * item.qty)}</div>
                    </div>
                    <button onClick={() => removeFromCart(i)} style={{ ...css.btn("ghost"), padding: "2px 7px", fontSize: 12, color: "#E53935" }}>✕</button>
                  </div>
                ))
            }
          </div>

          <div style={{ padding: "10px 14px", borderTop: "1px solid #EEE" }}>
            {activeCampaign && (
              <>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#888", marginBottom: 2 }}>
                  <span>ราคาปกติ</span><span>{fmtTHB(settings.basePrice * cartCount)}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#C62828", marginBottom: 2 }}>
                  <span>ลด {activeCampaign.discount}%</span>
                  <span>-{fmtTHB((settings.basePrice - price) * cartCount)}</span>
                </div>
              </>
            )}
            <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: 15, paddingTop: 8, borderTop: "1px solid #EEE" }}>
              <span>ยอดรวม</span><span style={{ color: "#1A1A2E" }}>{fmtTHB(cartTotal)}</span>
            </div>
            {cart.length > 0 && (
              <div style={{ fontSize: 10, color: "#888", marginTop: 4 }}>
                Net JUMP: {fmtTHB(calcNetRevenue(price, settings) * cartCount)} · กำไร: {fmtTHB(calcGrossProfit(price, settings) * cartCount)}
              </div>
            )}
            <button onClick={checkout} style={{ ...css.btn("success"), width: "100%", marginTop: 8 }}>
              ✓ ยืนยันการขาย
            </button>
            {cart.length > 0 && (
              <button onClick={() => setCart([])} style={{ ...css.btn("ghost"), width: "100%", marginTop: 4, fontSize: 11 }}>
                ล้างตะกร้า
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── PAGE: DASHBOARD ──────────────────────────────────────────────────────────

function PageDashboard({ stock, transactions, campaigns, settings }) {
  const sold   = transactions.reduce((a, t) => a + t.items.reduce((b, i) => b + i.qty, 0), 0);
  const rev    = transactions.reduce((a, t) => a + t.total, 0);
  const net    = transactions.reduce((a, t) => a + (t.netRevenue || 0), 0);
  const profit = transactions.reduce((a, t) => a + (t.grossProfit || 0), 0);
  const totalStock = Object.values(stock).reduce((a, v) => a + v, 0);

  const byProduct = PRODUCTS.map(p => ({
    p,
    sold: transactions.reduce((a, t) => a + t.items.filter(i => i.code === p.code).reduce((b, i) => b + i.qty, 0), 0)
  })).filter(x => x.sold > 0);
  const maxSold = Math.max(...byProduct.map(x => x.sold), 1);

  const kpis = [
    { label: "ขายแล้ว",      val: `${sold} ชิ้น`,    color: "#1565C0" },
    { label: "ยอดขายรวม",    val: fmtTHB(rev),       color: "#2E7D32" },
    { label: "Net (JUMP)",   val: fmtTHB(net),       color: "#1565C0" },
    { label: "กำไรรวม",      val: fmtTHB(profit),    color: profit >= 0 ? "#2E7D32" : "#C62828" },
  ];

  return (
    <div style={css.page}>
      <div style={css.pageTitle}>Dashboard</div>
      <div style={css.kpiGrid}>
        {kpis.map(k => (
          <div key={k.label} style={css.kpi}>
            <div style={css.kpiLabel}>{k.label}</div>
            <div style={{ ...css.kpiVal, color: k.color, fontSize: 18 }}>{k.val}</div>
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <div style={css.card}>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, color: "#888", marginBottom: 12 }}>ยอดขายแยกสินค้า</div>
          {byProduct.length === 0
            ? <div style={{ color: "#CCC", fontSize: 12, textAlign: "center", padding: 16 }}>ยังไม่มีข้อมูลการขาย</div>
            : byProduct.map(x => (
                <div key={x.p.code} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <div style={{ width: 30, height: 30, borderRadius: 6, overflow: "hidden", flexShrink: 0, background: "#F0F0F0" }}>
                    <ProductImg src={x.p.img} style={{ width: 30, height: 30 }} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{x.p.name}</div>
                    <div style={{ height: 8, background: "#F0F0F0", borderRadius: 4, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${Math.round(x.sold / maxSold * 100)}%`, background: "#1A1A2E", borderRadius: 4 }} />
                    </div>
                  </div>

function PageCampaigns({ campaigns, setCampaigns, saveCampaigns, settings, showToast }) {
  const [form, setForm] = useState({ name: "", discount: "", start: "", end: "", note: "" });

  const toggle = (i) => {
    const next = campaigns.map((c, j) => ({ ...c, active: j === i ? !c.active : false }));
    setCampaigns(next); saveCampaigns(next);
    showToast(next[i].active ? `เปิดแคมเปญ: ${next[i].name}` : "ปิดแคมเปญแล้ว");

            return (
              <div key={c.id} style={{ ...css.card, marginBottom: 8 }}>
                <div style={{ display: "flex", gap: 10 }}>

                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                      <span style={{ fontWeight: 700 }}>{c.name}</span>
                      <span style={css.badge(c.active ? "gold" : "gray")}>{c.active ? "ACTIVE" : "inactive"}</span>
                    </div>
                    <div style={{ fontSize: 12, color: "#666" }}>ลด {c.discount}% · ราคาขาย {fmtTHB(cp)}</div>
                    <div style={{ fontSize: 11, color: "#AAA" }}>{c.start || "–"} → {c.end || "–"}{c.note ? ` · ${c.note}` : ""}</div>
                    {c.active && <div style={{ fontSize: 11, marginTop: 5, color: "#555" }}>
                      Net JUMP: <strong>{fmtTHB(calcNetRevenue(cp, settings))}</strong> · กำไร: <strong>{fmtTHB(calcGrossProfit(cp, settings))}</strong>
                    </div>}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 4, flexShrink: 0 }}>
                    <button onClick={() => toggle(i)} style={css.btn(c.active ? "danger" : "primary")}>{c.active ? "ปิดใช้" : "เปิดใช้"}</button>
                    <button onClick={() => del(i)} style={{ ...css.btn("ghost"), color: "#C62828" }}>ลบ</button>
                  </div>

        <div>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4, color: "#888", marginBottom: 10 }}>สร้างแคมเปญใหม่</div>
          <div style={css.card}>

              {[["start", "วันเริ่ม", "date"], ["end", "วันสิ้นสุด", "date"]].map(([k, l, t]) => (

  const [tab, setTab]               = useState("pos");
  const [stock, setStock]           = useState(() => storageGet(SK.stock, INITIAL_STOCK));
  const [transactions, setTxns]     = useState(() => storageGet(SK.txns, []));
  const [campaigns, setCampaigns]   = useState(() => storageGet(SK.camps, INITIAL_CAMPAIGNS));
  const [settings, setSettings]     = useState(() => storageGet(SK.settings, SETTINGS_DEFAULT));
  const [cart, setCart]             = useState([]);
  const [toast, setToast]           = useState(null);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  }, []);

  const saveStock    = useCallback((v) => storageSet(SK.stock, v), []);
  const saveTxns     = useCallback((v) => storageSet(SK.txns, v), []);
  const saveCampaigns= useCallback((v) => storageSet(SK.camps, v), []);
  const saveSettings = useCallback((v) => storageSet(SK.settings, v), []);

  const pageProps = { stock, setStock, transactions, setTransactions: setTxns, campaigns, setCampaigns, settings, setSettings, cart, setCart, saveStock, saveTxns, saveCampaigns, saveSettings, showToast };

  return (
    <div style={css.app}>
      <Toast msg={toast} />

      {/* Sidebar */}
      <div style={css.sidebar}>
        <div style={css.logo}>
          <div style={css.logoTitle}>JUMPEI POS</div>
          <div style={css.logoSub}>Actiff consignment system</div>
        </div>
        <nav style={{ flex: 1, padding: "8px 0", overflowY: "auto" }}>
          {NAV_ITEMS.map(n => (
            <button key={n.key} onClick={() => setTab(n.key)} style={css.navBtn(tab === n.key)}>
              <span style={{ fontSize: 14 }}>{n.icon}</span>{n.label}
            </button>
          ))}
        </nav>
        <div style={{ padding: "10px 16px", borderTop: "1px solid rgba(255,255,255,0.08)", fontSize: 10, color: "rgba(255,255,255,0.25)" }}>
          v2.0 · with images
        </div>
      </div>

      {/* Content */}
      <div style={css.content}>
        {tab === "pos"       && <PagePOS       {...pageProps} />}
        {tab === "dashboard" && <PageDashboard {...pageProps} />}
        {tab === "stock"     && <PageStock     {...pageProps} />}
        {tab === "campaigns" && <PageCampaigns {...pageProps} />}
        {tab === "qr"        && <PageQR        {...pageProps} />}
        {tab === "history"   && <PageHistory   {...pageProps} />}
        {tab === "settings"  && <PageSettings  {...pageProps} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
